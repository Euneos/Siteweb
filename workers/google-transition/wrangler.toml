name = "euneos-google-transition"
main = "worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ENABLED = "false"
PROJECTION_ENABLED = "false"
INPUT_MODE = "push"
# Set INPUT_MODE="push" for the authenticated Apps Script transport. In push
# mode cron is inert, /ingest accepts one complete source, /check is read-only,
# ENABLED still gates all ingestion. Future push projection requires eventVersion=2,
# cohortId=2, audited mapping/policy (pinned headerDigest and duplicate columns),
# an explicit ISO cutover AND projectionFirstRow per contact/deploiement source.
# The receiver independently requires the same cutover, firstRow and headerDigest.
# Previously captured rows and all revisions >1 stay
# capture-only. Never enable the projection flag merely to replay the backlog.
# PROJECTION_START_AT = "..."

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "STATE"
database_name = "euneos-form-submissions"
database_id = "cd011a86-8198-4348-b652-aa09ca245d11"

[observability]
enabled = true

# Secrets: NOCODB_TOKEN, JOURNAL_TABLE, SOURCES, RUN_SECRET,
# Optional contiguous SOURCES_2 ... SOURCES_12: complete JSON arrays in order.
# Keep each secret below 5 KB; validate the combined catalogue before installing.
# GOOGLE_FORMS_SYNC_SECRET (needed for contact/deploiement hook projection).
# personProjection mappings are documented in RECONCILIATION.md. Adult creation
# also requires the additive google_transition_person_claims table from schema.sql.
# Optional INGEST_SECRET separates /ingest and /check from the operator secret;
# without it they use RUN_SECRET. Never configure a Google user token here.
# Sources and customer answers never belong in this repository.
# Hard application budgets: 10 processed rows, 100 inspected rows, 5 sources,
# 48 external HTTP requests INCLUDING retries/redirects, plus 48 D1 queries
# INCLUDING failed queries, cursor checkpoints and final lock release. These
# independent budgets stay below the Free limits; no paid-plan assumption.
# schema.sql is expanded for durable raw evidence, pending-write reconciliation,
# run ownership and cursors. Existing prototype tables need a separately reviewed
# migration; CREATE IF NOT EXISTS does not upgrade a previously installed schema.
