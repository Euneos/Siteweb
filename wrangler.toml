# Configuration Cloudflare Pages du site EUNEOS.
# nodejs_compat est requis par l'adaptateur @astrojs/cloudflare.
name = "euneos-site"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# La limitation des POST est geree par la regle de securite Cloudflare
# « Limiter les formulaires publics EUNEOS » (5 requetes / 10 s / IP).
# Cloudflare Pages ne prend pas en charge les bindings ratelimits.
