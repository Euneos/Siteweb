# Configuration Cloudflare Pages du site EUNEOS.
# nodejs_compat est requis par l'adaptateur @astrojs/cloudflare.
name = "euneos-site"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# La limitation des POST est geree par la regle de securite Cloudflare
# « Limiter les formulaires publics EUNEOS » (5 requetes / 10 s / IP).
# Cloudflare Pages ne prend pas en charge les bindings ratelimits.

# Identifiant public de la liste Brevo ; versionné pour que chaque déploiement
# conserve le routage formateurs. Les clés API restent des secrets Cloudflare.
[vars]
BREVO_LIST_FORMATEUR = "6"
BREVO_LIST_ENJEUX = "9"

# Adresse publique de réception des demandes du formulaire de contact.
CONTACT_EMAIL = "euneosequipe@gmail.com"
INTERNAL_WORKSPACE_IMPORT_PENDING = "true"
OPERATIONAL_FORMS_ENABLED = "true"

# Registre technique des soumissions : clés hachées et IDs, aucun contenu métier.
[[d1_databases]]
binding = "FORM_SUBMISSIONS"
database_name = "euneos-form-submissions"
database_id = "cd011a86-8198-4348-b652-aa09ca245d11"

# Stockage des calendriers publiés, distinct de la recette et des formulaires.
[[d1_databases]]
binding = "TEAM_WORKSPACE"
database_name = "euneos-team-workspace"
database_id = "b178cff0-1860-4929-b697-d7152b32b53f"
migrations_dir = "migrations/interne"

# Les calendriers de recette sont isolés de la production. Les variables
# non héritées sont répétées pour préserver le routage des formulaires.
[env.preview.vars]
BREVO_LIST_FORMATEUR = "6"
BREVO_LIST_ENJEUX = "9"
CONTACT_EMAIL = "euneosequipe@gmail.com"
INTERNAL_WORKSPACE_PREVIEW = "true"
OPERATIONAL_FORMS_ENABLED = "false"

[[env.preview.d1_databases]]
binding = "FORM_SUBMISSIONS"
database_name = "euneos-form-submissions"
database_id = "cd011a86-8198-4348-b652-aa09ca245d11"

[[env.preview.d1_databases]]
binding = "TEAM_WORKSPACE"
database_name = "euneos-team-workspace-preview"
database_id = "e4d5fb32-d56e-4e37-a589-72cf0e9d4bc5"
migrations_dir = "migrations/interne"
