# Configuration Cloudflare Pages du site EUNEOS.
# nodejs_compat est requis par l'adaptateur @astrojs/cloudflare.
name = "euneos-site"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# La limitation des POST est geree par la regle de securite Cloudflare
# « Limiter les formulaires publics EUNEOS » (5 requetes / 10 s / IP).
# Cloudflare Pages ne prend pas en charge les bindings ratelimits.

# Identifiant public de la liste Brevo ; versionné pour que chaque déploiement
# conserve le routage formateurs. Les clés API restent des secrets Cloudflare.
[vars]
BREVO_LIST_FORMATEUR = "6"

# Adresse publique de réception des demandes du formulaire de contact.
CONTACT_EMAIL = "euneosequipe@gmail.com"

# Registre technique des soumissions : clés hachées et IDs, aucun contenu métier.
[[d1_databases]]
binding = "FORM_SUBMISSIONS"
database_name = "euneos-form-submissions"
database_id = "cd011a86-8198-4348-b652-aa09ca245d11"
