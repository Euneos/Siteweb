name: Veille thématique
run-name: Veille · ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifiant de la requête chiffrée
        required: true
        type: string
      envelope:
        description: Enveloppe chiffrée des sujets (aucun contenu en clair)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: euneos-team-workspace-deployment
  cancel-in-progress: false
jobs:
  synchroniser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Vérifier la révision courante
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/check-deployment-revision.mjs
      - name: Lire ou ajouter des sujets sans écraser les fiches existantes
        env:
          AGENDA_ENVELOPE: ${{ inputs.envelope }}
          AGENDA_REQUEST_ID: ${{ inputs.request_id }}
          AGENDA_IMPORT_PRIVATE_KEY: ${{ secrets.AGENDA_IMPORT_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/veille-sync-ci.ts
      - uses: actions/upload-artifact@v4
        with:
          name: veille-${{ inputs.request_id }}
          path: veille-response.enc.json
          retention-days: 1
          if-no-files-found: error
