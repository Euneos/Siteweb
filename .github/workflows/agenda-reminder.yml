name: Rappel agenda du lundi
on:
  schedule:
    # Deux créneaux UTC ; le programme conserve uniquement 11 h 30 Europe/Paris.
    - cron: '30 9,10 * * 1'
  workflow_dispatch:
    inputs:
      check_only:
        description: Vérifier la configuration sans envoyer de message
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: euneos-agenda-reminder
  cancel-in-progress: false
jobs:
  rappel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Rappel signé vers le serveur EUNEOS
        env:
          AGENDA_REMINDER_PRIVATE_KEY: ${{ secrets.AGENDA_REMINDER_PRIVATE_KEY }}
          AGENDA_REMINDER_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only && 'true' || 'false' }}
        run: bun scripts/agenda-reminder.ts
