# Deploiement automatique du site EUNEOS.
#
# PR interne : preview. Main : migrations preview, puis production, puis Pages.
# Les URLs de preview sont distinctes, leur base TEAM_WORKSPACE est commune.
# L'equipe d'EUNEOS n'a rien a lancer : elle demande une modification a l'agent,
# l'agent pousse sur GitHub, et le site se met a jour tout seul.
#
# Les trois secrets vivent dans Settings > Secrets and variables > Actions :
#   CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · NOCODB_TOKEN
name: Deploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Meme version que `bun.lock` et que les postes de l'equipe.
  # Surtout pas `latest` : le 27/08 le runner a tire 1.4.0 et le
  # telechargement a casse (ECONNRESET), le site n'est pas parti.
  BUN_VERSION: 1.3.11
  SITE_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.euneos-site.pages.dev', github.event.number) || 'https://euneos.fr' }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Secours : le telechargement de bun echoue de temps en temps sur les
      # runners. Sans ce filet, une panne reseau de dix secondes fait croire
      # a l'equipe que sa modification est en ligne alors qu'elle ne l'est pas.
      - name: Installer bun — deuxieme essai
        if: steps.bun.outcome == 'failure'
        run: |
          for essai in 1 2 3; do
            curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}" && break
            echo "::warning::tentative $essai echouee, nouvel essai dans 10 s"
            sleep 10
          done
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Installer les dependances
        run: bun install --frozen-lockfile

      - name: Vérifier les formulaires et les profils newsletter
        run: bun run test

      - name: Vérifier le lot transactionnel sur D1 local
        run: bun scripts/check-internal-migrations-d1.mjs

      - name: Vérifier le registre des emails sur D1 local
        run: bun scripts/check-candidature-mails-d1.mjs

      - name: Construire le site
        run: bun run build

      - name: Vérifier le rendu responsive compilé
        run: |
          bunx playwright install --with-deps chromium
          bun scripts/check-internal-table.mjs
          bun scripts/check-internal-workspace.mjs
          bun scripts/check-implantations.mjs
          bun run test:operational
          bun scripts/check-preformation.mjs
          bun scripts/check-accord-formateur.mjs
          bun scripts/check-candidature-decisions-ui.mjs
          bunx wrangler pages dev dist --port 4321 --ip 127.0.0.1 > /tmp/euneos-layout.log 2>&1 &
          layout_server_pid=$!
          trap 'kill "$layout_server_pid" 2>/dev/null || true' EXIT
          for essai in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/qui-sommes-nous > /dev/null; then break; fi
            sleep 1
          done
          bun run test:newsletter
          bun run test:layout
          bun run test:rhythm
          AUDIT_WIDTHS=320,390,599,600,601,768,859,860,861,900,901,1024,1099,1100,1101,1300,1440,1920,2560,3840 bun run test:responsive

      - name: Conserver le build vérifié
        uses: actions/upload-artifact@v4
        with:
          name: site-verifie
          path: dist
          include-hidden-files: true
          retention-days: 3

  deployer:
    needs: verifier
    # Aucun secret ni job privilégié pour un fork, Dependabot ou un dispatch hors main.
    if: >-
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    concurrency:
      # Commun à toutes les PR et main, jusqu'au dernier déploiement Pages.
      # Ne pas annuler un job qui a commencé à migrer.
      group: euneos-team-workspace-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer le moteur verrouillé
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: site-verifie
          path: dist

      - name: Migrer et vérifier la base preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/internal-migrations.mjs apply-ci --environment preview --receipt "$RUNNER_TEMP/d1-receipts/preview.json"

      - name: Mettre la preview sur Cloudflare Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'validation-main' }}
        run: |
          bun scripts/check-deployment-revision.mjs
          bunx --no-install wrangler pages deploy dist --project-name=euneos-site --branch="$PREVIEW_BRANCH"

      - name: Migrer et vérifier la base production après preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/internal-migrations.mjs apply-ci --environment production --preview-receipt "$RUNNER_TEMP/d1-receipts/preview.json" --receipt "$RUNNER_TEMP/d1-receipts/production.json"

      - name: Mettre en production sur Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun scripts/check-deployment-revision.mjs
          bunx --no-install wrangler pages deploy dist --project-name=euneos-site --branch=main

      - name: Conserver les reçus techniques (aucune donnée métier)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d1-receipts/*.json
          if-no-files-found: ignore
          retention-days: 30
