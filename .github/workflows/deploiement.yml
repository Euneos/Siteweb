# Deploiement automatique du site EUNEOS.
#
# A chaque PR : preview isolee. A chaque push sur main : mise en production.
# L'equipe d'EUNEOS n'a rien a lancer : elle demande une modification a l'agent,
# l'agent pousse sur GitHub, et le site se met a jour tout seul.
#
# Les trois secrets vivent dans Settings > Secrets and variables > Actions :
#   CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · NOCODB_TOKEN
name: Deploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: true

env:
  # Meme version que `bun.lock` et que les postes de l'equipe.
  # Surtout pas `latest` : le 27/08 le runner a tire 1.4.0 et le
  # telechargement a casse (ECONNRESET), le site n'est pas parti.
  BUN_VERSION: 1.3.11
  SITE_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.euneos-site.pages.dev', github.event.number) || 'https://euneos.fr' }}

jobs:
  deployer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Secours : le telechargement de bun echoue de temps en temps sur les
      # runners. Sans ce filet, une panne reseau de dix secondes fait croire
      # a l'equipe que sa modification est en ligne alors qu'elle ne l'est pas.
      - name: Installer bun — deuxieme essai
        if: steps.bun.outcome == 'failure'
        run: |
          for essai in 1 2 3; do
            curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}" && break
            echo "::warning::tentative $essai echouee, nouvel essai dans 10 s"
            sleep 10
          done
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Installer les dependances
        run: bun install --frozen-lockfile

      - name: Construire le site
        run: bun run build

      - name: Mettre en production sur Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=euneos-site --branch=main

      - name: Mettre la preview sur Cloudflare Pages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=euneos-site --branch=pr-${{ github.event.number }}
