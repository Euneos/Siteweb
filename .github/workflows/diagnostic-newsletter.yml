name: Diagnostic newsletter
on:
  push:
    branches: [codex/diagnostic-newsletter]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Lire les erreurs newsletter pendant trois minutes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler pages deployment list --project-name euneos-site --environment production --json > /tmp/deployments.json
          newsletter_deployment=$(python3 -c 'import json; print(json.load(open("/tmp/deployments.json"))[0]["Id"])')
          timeout 180s bunx wrangler pages deployment tail "$newsletter_deployment" --project-name euneos-site --environment production --format json --search '[newsletter]' > /tmp/newsletter-tail.json || test "$?" = 124
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          raw = Path('/tmp/newsletter-tail.json').read_text()
          decoder = json.JSONDecoder()
          count = 0
          while raw.strip():
              raw = raw.lstrip()
              try:
                  event, end = decoder.raw_decode(raw)
              except ValueError:
                  raw = raw.partition('\n')[2]
                  continue
              raw = raw[end:]
              for log in event.get('logs', []):
                  message = ' '.join(str(s) for s in log.get('message', []))
                  if '[newsletter]' in message:
                      count += 1
                      message = re.sub(r'[\w.+%-]+@[\w.-]+', '[email]', message)
                      message = re.sub(r'https?://\S+', '[url]', message)
                      print(message[:600])
          print('Erreurs newsletter recueillies:', count)
          PY
